name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # D1のスキーマを先に本番へ反映してから、新しいコードをデプロイする。
      # 順序が逆だと新コードが未適用のスキーマを参照して失敗しうる。
      - name: Apply D1 migrations
        run: pnpm --filter backend db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          AUTH_SESSION_TTL_SECONDS: ${{ vars.AUTH_SESSION_TTL_SECONDS }}
        run: |
          set -euo pipefail

          : "${LINE_CHANNEL_ID:?GitHub Secret LINE_CHANNEL_ID is required}"
          : "${CORS_ORIGIN:?GitHub Actions Variable CORS_ORIGIN is required}"
          AUTH_SESSION_TTL_SECONDS="${AUTH_SESSION_TTL_SECONDS:-2592000}"

          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT

          umask 077
          printf 'LINE_CHANNEL_ID=%s\n' "$LINE_CHANNEL_ID" > "$secret_file"

          pnpm exec wrangler deploy --minify \
            --secrets-file "$secret_file" \
            --var "CORS_ORIGIN:$CORS_ORIGIN" \
            --var "AUTH_SESSION_TTL_SECONDS:$AUTH_SESSION_TTL_SECONDS"
