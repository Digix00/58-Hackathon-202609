<div id="storybook-post" aria-label="目安箱の絵本とクレヨンを思わせる投稿画面デザイン案">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yomogi&display=swap');
    #storybook-post{color:light-dark(#4b4944,#f5f0e9);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif}#storybook-post *{box-sizing:border-box}.sp-phone{position:relative;max-width:390px;margin:auto;overflow:hidden;border:2px solid light-dark(#49463f,#e2d9ca);border-radius:22px 27px 24px 29px;background-color:light-dark(#fffdf7,#292723);background-image:repeating-linear-gradient(7deg,transparent 0 8px,light-dark(#ede7dd55,#ffffff08) 9px 10px)}.sp-cloud{position:absolute;top:24px;right:-12px;width:95px;height:44px;border:3px solid light-dark(#b3dcd0,#609286);border-radius:48% 58% 50% 44%;opacity:.8;transform:rotate(8deg)}.sp-head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:22px 23px 0}.sp-back{min-height:44px;margin-left:-8px;padding:0 8px;border:0;color:inherit;background:transparent;font:17px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer}.sp-title{margin:0;font:400 26px "Yomogi","Hiragino Maru Gothic ProN",cursive;letter-spacing:.05em;transform:rotate(-1deg)}.sp-main{position:relative;padding:37px 23px 28px}.sp-main h1{margin:0 0 21px;font:400 25px/1.5 "Yomogi","Hiragino Maru Gothic ProN",cursive}.sp-paper{position:relative;padding:19px 17px 12px;border:2px solid light-dark(#6d695f,#d6cec1);border-radius:22px 18px 25px 16px;background:light-dark(#fffefb,#312e29);box-shadow:3px 4px 0 light-dark(#f3dba9,#5a4a2b);transform:rotate(-.4deg)}.sp-paper:before{content:"";position:absolute;width:38px;height:10px;top:-7px;right:29px;border-radius:50%;background:light-dark(#f2ba9c,#825e52);transform:rotate(7deg)}textarea{display:block;width:100%;min-height:166px;resize:vertical;border:0;outline:0;color:inherit;background:transparent;font:18px/1.8 "Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;letter-spacing:.02em}textarea::placeholder{color:light-dark(#aaa296,#aaa195);opacity:1}.sp-count{margin:0;color:light-dark(#90887e,#bdb4a6);text-align:right;font:14px "Yomogi","Hiragino Maru Gothic ProN",cursive}.sp-voice{display:flex;align-items:center;justify-content:center;width:max-content;min-height:44px;margin:22px auto;padding:0 14px;border:2px solid light-dark(#6d695f,#d6cec1);border-radius:17px 20px 16px 19px;color:inherit;background:light-dark(#dceee9,#36564e);font:17px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer;transform:rotate(.45deg)}details{margin:15px 0 22px}summary{width:max-content;min-height:40px;padding:9px 0;color:light-dark(#625d87,#d9d2ff);font:17px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer}.sp-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}select{min-height:40px;border:2px solid light-dark(#8a847a,#c9c0b3);border-radius:13px 15px 12px 14px;color:inherit;background:light-dark(#fffefb,#312e29);font:15px inherit}.sp-note{margin:0;color:light-dark(#787167,#bbb2a4);font-size:12px;line-height:1.65}.sp-submit{display:block;width:calc(100% - 20px);min-height:50px;margin:24px auto 0;border:0;border-radius:48% 52% 49% 51%;color:#fffdf7;background:light-dark(#7e75b5,#968ed0);font:20px "Yomogi","Hiragino Maru Gothic ProN",cursive;box-shadow:2px 3px 0 light-dark(#5b5485,#5d567f);transform:rotate(-.45deg);cursor:pointer}.sp-submit:disabled{opacity:.55;cursor:not-allowed}.sp-nav{display:flex;justify-content:center;gap:18px;padding:13px 18px 19px}.sp-nav button{min-height:42px;padding:0 3px;border:0;color:light-dark(#8c857b,#bbb2a4);background:transparent;font:16px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer}.sp-nav button[aria-current=page]{color:light-dark(#514c82,#d8d1ff);text-decoration:underline wavy light-dark(#9891cf,#b5ace6) 1.5px;text-underline-offset:5px}
  </style>
  <style>
    #storybook-post{color:light-dark(#292722,#fffaf1)}
    #storybook-post .sp-phone{background-image:none}
    #storybook-post .sp-paper{border-width:1px;box-shadow:5px 6px 0 light-dark(#f3dba9,#5a4a2b)}
    #storybook-post textarea{color:light-dark(#292722,#fffaf1);font-size:19px;line-height:1.9}
    #storybook-post textarea::placeholder{color:light-dark(#706a60,#d5cdc2)}
    #storybook-post .sp-note{color:light-dark(#5c574f,#e0d7cb);font-size:13px;line-height:1.7}
    #storybook-post summary{color:light-dark(#413a70,#e3dcff);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-size:16px;font-weight:500}
  </style>
  <section class="sp-phone" aria-label="目安箱 投稿"><span class="sp-cloud" aria-hidden="true"></span><header class="sp-head"><button class="sp-back" type="button">← もどる</button><p class="sp-title">目安箱</p></header><main class="sp-main"><h1>ここに、<br>そっと書いてね。</h1><div class="sp-paper"><label hidden for="sp-concern">悩み</label><textarea id="sp-concern" maxlength="300" placeholder="うまくまとまっていなくても大丈夫。"></textarea><p class="sp-count"><span id="sp-count">0</span> / 300</p></div><button class="sp-voice" type="button">話して書く</button><details><summary>わたしのこと（任意）</summary><div class="sp-options"><select aria-label="年代"><option>年代</option><option>10代</option><option>20代</option><option>30代以上</option><option>答えない</option></select><select aria-label="都道府県"><option>都道府県</option><option>大阪府</option><option>東京都</option><option>愛知県</option><option>福岡県</option><option>答えない</option></select></div></details><p class="sp-note">名前・連絡先・住所は書かないでね。<br>ここは緊急の相談先ではありません。</p><button class="sp-submit" type="button" disabled>そっと置く</button></main><nav class="sp-nav" aria-label="画面移動"><button type="button">読む</button><button type="button">クイズ</button><button type="button" aria-current="page">投稿</button><button type="button">履歴</button></nav></section>
  <script>(()=>{const root=document.getElementById('storybook-post'),field=root.querySelector('#sp-concern'),count=root.querySelector('#sp-count'),submit=root.querySelector('.sp-submit');field.addEventListener('input',()=>{count.textContent=field.value.length;submit.disabled=field.value.trim().length===0})})()</script>
</div>
<style>#storybook-post .sp-paper:before{width:62px;height:16px;top:-8px;right:23px;border-radius:1px;background:light-dark(#f2ba9ccc,#825e52cc);clip-path:polygon(2% 4%,100% 8%,97% 100%,0 92%);transform:rotate(5deg)}</style>
<style>#storybook-post .sp-cloud{display:none}</style>
