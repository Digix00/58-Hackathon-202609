<div id="storybook-quiz" aria-label="目安箱の絵本とクレヨンを思わせるクイズ画面デザイン案">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yomogi&display=swap');
    #storybook-quiz{color:light-dark(#4b4944,#f5f0e9);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif}#storybook-quiz *{box-sizing:border-box}.sq-phone{position:relative;max-width:390px;margin:auto;overflow:hidden;border:2px solid light-dark(#49463f,#e2d9ca);border-radius:22px 27px 24px 29px;background-color:light-dark(#fffdf7,#292723);background-image:repeating-linear-gradient(7deg,transparent 0 8px,light-dark(#ede7dd55,#ffffff08) 9px 10px)}.sq-star{position:absolute;top:24px;right:31px;width:31px;height:31px;border:3px solid light-dark(#e7ad4f,#e5b55e);border-radius:48% 54% 42% 56%;transform:rotate(22deg);opacity:.9}.sq-star:after{content:"";position:absolute;width:14px;height:14px;right:-20px;bottom:-13px;border:2px solid light-dark(#b8ddd2,#5d8e80);border-radius:50%}.sq-head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:22px 23px 0}.sq-back{min-height:44px;margin-left:-8px;padding:0 8px;border:0;color:inherit;background:transparent;font:17px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer}.sq-title{margin:0;font:400 26px "Yomogi","Hiragino Maru Gothic ProN",cursive;letter-spacing:.05em;transform:rotate(-1deg)}.sq-main{position:relative;padding:34px 23px 27px}.sq-main h1{margin:0 0 5px;font:400 25px/1.5 "Yomogi","Hiragino Maru Gothic ProN",cursive}.sq-guide{margin:0 0 17px;color:light-dark(#777066,#bbb2a4);font-size:13px}.sq-bookmarks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:27px}.sq-bookmark{min-height:64px;padding:8px 6px;border:2px solid light-dark(#706a60,#d6cec1);border-radius:12px 16px 10px 14px;background:light-dark(#f9e7ac,#665529);text-align:center;transform:rotate(-1deg)}.sq-bookmark:nth-child(2){background:light-dark(#cde5dc,#3a5d55);transform:rotate(1.2deg)}.sq-bookmark:nth-child(3){background:light-dark(#e3dafa,#554b76);transform:rotate(-.5deg)}.sq-bookmark b{display:block;font:400 18px "Yomogi","Hiragino Maru Gothic ProN",cursive}.sq-bookmark span{display:block;margin-top:2px;font-size:11px}.sq-paper{position:relative;padding:23px 20px 19px;border:2px solid light-dark(#6d695f,#d6cec1);border-radius:21px 25px 18px 23px;background:light-dark(#fffefb,#312e29);box-shadow:3px 4px 0 light-dark(#f1cead,#5d4539);transform:rotate(.35deg)}.sq-paper:before{content:"";position:absolute;width:37px;height:9px;top:-7px;left:28px;border-radius:50%;background:light-dark(#b7ded1,#50786d);transform:rotate(-9deg)}.sq-number{margin:0;color:light-dark(#858075,#bab1a4);font:16px "Yomogi","Hiragino Maru Gothic ProN",cursive}.sq-letter{min-height:116px;margin:14px 0 19px;font-size:18px;letter-spacing:.02em;line-height:1.85}fieldset{padding:0;margin:0;border:0}legend{margin-bottom:10px;font:17px "Yomogi","Hiragino Maru Gothic ProN",cursive}.sq-choices{display:flex;gap:7px}.sq-choice{flex:1;position:relative;display:grid;place-items:center;min-height:42px;border:2px solid light-dark(#817b72,#c4bbaf);border-radius:13px 16px 12px 15px;color:inherit;background:transparent;font:18px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer}.sq-choice input{position:absolute;opacity:0}.sq-choice:has(input:checked){color:#fffdf7;background:light-dark(#7e75b5,#968ed0);border-color:light-dark(#61598f,#b2a8e4)}.sq-controls{display:flex;align-items:center;justify-content:space-between;margin-top:22px}.sq-prev,.sq-next{min-height:44px;border:0;font:17px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer}.sq-prev{padding:0 6px;color:light-dark(#777066,#bbb2a4);background:transparent}.sq-next{padding:0 14px;border-radius:48% 52% 49% 51%;color:#fffdf7;background:light-dark(#7e75b5,#968ed0);box-shadow:2px 3px 0 light-dark(#5b5485,#5d567f);transform:rotate(-.5deg)}.sq-status,.sq-result{margin:17px 0 0;color:light-dark(#625d87,#d9d2ff);text-align:center;font:16px "Yomogi","Hiragino Maru Gothic ProN",cursive;line-height:1.6}.sq-nav{display:flex;justify-content:center;gap:18px;padding:13px 18px 19px}.sq-nav button{min-height:42px;padding:0 3px;border:0;color:light-dark(#8c857b,#bbb2a4);background:transparent;font:16px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer}.sq-nav button[aria-current=page]{color:light-dark(#514c82,#d8d1ff);text-decoration:underline wavy light-dark(#9891cf,#b5ace6) 1.5px;text-underline-offset:5px}
  </style>
  <style>
    #storybook-quiz{color:light-dark(#292722,#fffaf1)}
    #storybook-quiz .sq-phone{background-image:none}
    #storybook-quiz .sq-paper{border-width:1px;box-shadow:5px 6px 0 light-dark(#f1cead,#5d4539)}
    #storybook-quiz .sq-guide{color:light-dark(#5c574f,#e0d7cb);font-size:14px}
    #storybook-quiz .sq-letter{color:light-dark(#292722,#fffaf1);font-size:19px;line-height:1.9}
    #storybook-quiz legend{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-size:16px;font-weight:500}
    #storybook-quiz .sq-bookmark span{font-size:12px;font-weight:500}
  </style>
  <section class="sq-phone" aria-label="目安箱 今日のクイズ"><span class="sq-star" aria-hidden="true"></span><header class="sq-head"><button class="sq-back" type="button">← もどる</button><p class="sq-title">目安箱</p></header><main class="sq-main"><h1>きょうの、3つの手紙。</h1><p class="sq-guide">手紙としおりを、結んでみよう。</p><div class="sq-bookmarks" aria-label="3人のしおり"><div class="sq-bookmark"><b>A</b><span>20代・東京都</span></div><div class="sq-bookmark"><b>B</b><span>10代・大阪府</span></div><div class="sq-bookmark"><b>C</b><span>30代・愛知県</span></div></div><article class="sq-paper" aria-live="polite"><p class="sq-number" id="sq-number">手紙 1 / 3</p><p class="sq-letter" id="sq-letter">周りは進む道を決めているように見えて、少し焦ります。</p><fieldset><legend>この手紙は、だれから？</legend><div class="sq-choices"><label class="sq-choice">A<input type="radio" name="sq-answer" value="A"></label><label class="sq-choice">B<input type="radio" name="sq-answer" value="B"></label><label class="sq-choice">C<input type="radio" name="sq-answer" value="C"></label></div></fieldset></article><div class="sq-controls"><button class="sq-prev" type="button" disabled>← まえへ</button><button class="sq-next" type="button">つぎの手紙</button></div><p class="sq-status" id="sq-status">1 / 3</p><p class="sq-result" id="sq-result" hidden></p></main><nav class="sq-nav" aria-label="画面移動"><button type="button">読む</button><button type="button" aria-current="page">クイズ</button><button type="button">投稿</button><button type="button">履歴</button></nav></section>
  <script>(()=>{const root=document.getElementById('storybook-quiz'),letters=['周りは進む道を決めているように見えて、少し焦ります。','転職したい気持ちはあるけれど、今の場所を離れるのがこわいです。','親の介護と仕事のことを、どちらもちゃんとできていない気がします。'],answers=[null,null,null];let current=0;const number=root.querySelector('#sq-number'),letter=root.querySelector('#sq-letter'),status=root.querySelector('#sq-status'),previous=root.querySelector('.sq-prev'),next=root.querySelector('.sq-next'),result=root.querySelector('#sq-result'),radios=[...root.querySelectorAll('input[name="sq-answer"]')];function render(){number.textContent=`手紙 ${current+1} / 3`;letter.textContent=letters[current];status.textContent=`${current+1} / 3`;previous.disabled=current===0;radios.forEach(r=>r.checked=r.value===answers[current]);next.textContent=current===2?'答えをみる':'つぎの手紙'}radios.forEach(r=>r.addEventListener('change',()=>answers[current]=r.value));previous.addEventListener('click',()=>{if(current>0){current--;render()}});next.addEventListener('click',()=>{if(current<2){current++;render()}else{result.hidden=false;result.textContent='答えは B・A・C。属性だけでは決められないことも、言葉を読むと少し見えてきます。';next.hidden=true;previous.hidden=true}})})()</script>
</div>
<style>#storybook-quiz .sq-paper:before{width:62px;height:16px;top:-8px;left:21px;border-radius:1px;background:light-dark(#b7ded1cc,#50786dcc);clip-path:polygon(0 8%,100% 0,97% 93%,3% 100%);transform:rotate(-4deg)}</style>
<style>#storybook-quiz .sq-star{display:none}</style>
