<div id="storybook-feed" aria-label="目安箱の絵本とクレヨンを思わせるフィード画面デザイン案">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yomogi&display=swap');
    #storybook-feed{color:light-dark(#4b4944,#f5f0e9);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif}#storybook-feed *{box-sizing:border-box}.sb-phone{position:relative;max-width:390px;margin:auto;overflow:hidden;border:2px solid light-dark(#49463f,#e2d9ca);border-radius:22px 27px 24px 29px;background-color:light-dark(#fffdf7,#292723);background-image:repeating-linear-gradient(7deg,transparent 0 8px,light-dark(#ede7dd55,#ffffff08) 9px 10px)}.sb-sun{position:absolute;top:21px;right:25px;width:49px;height:49px;border:3px solid light-dark(#e9a84a,#eab55d);border-radius:49% 51% 46% 54%;opacity:.85;transform:rotate(-12deg)}.sb-sun:before,.sb-sun:after{content:"";position:absolute;width:3px;height:12px;border-radius:50%;background:light-dark(#e9a84a,#eab55d)}.sb-sun:before{left:-9px;top:17px;transform:rotate(-48deg)}.sb-sun:after{right:-9px;top:18px;transform:rotate(48deg)}.sb-head{position:relative;padding:27px 25px 0}.sb-title,.sb-hello,.sb-think,.sb-next,.sb-post,.sb-nav button{font-family:"Yomogi","Hiragino Maru Gothic ProN",cursive}.sb-title{margin:0;font-size:27px;font-weight:400;letter-spacing:.07em;transform:rotate(-1.5deg)}main{position:relative;padding:53px 24px 28px}.sb-hello{margin:0 0 29px;font-size:25px;font-weight:400;line-height:1.55;transform:rotate(.4deg)}.sb-card{position:relative;padding:26px 21px 21px;border:2px solid light-dark(#6d695f,#d6cec1);border-radius:25px 21px 26px 19px;background:light-dark(#fffefb,#312e29);box-shadow:4px 4px 0 light-dark(#f1dfac,#5a4b28);transform:rotate(-.55deg)}.sb-card:before{content:"";position:absolute;top:-7px;left:27px;width:42px;height:10px;border-radius:50%;background:light-dark(#b9ded2,#527f71);transform:rotate(-7deg);opacity:.82}.sb-meta{margin:0;color:light-dark(#878075,#bbb2a4);font-family:"Yomogi","Hiragino Maru Gothic ProN",cursive;font-size:16px}.sb-body{margin:16px 0 24px;font-size:18px;line-height:1.85;letter-spacing:.025em}.sb-actions{display:flex;align-items:center;justify-content:space-between}.sb-think,.sb-next{min-height:44px;font-size:16px;cursor:pointer}.sb-think{padding:0 12px;border:2px solid light-dark(#6d695f,#d6cec1);border-radius:18px 15px 17px 13px;color:inherit;background:light-dark(#f8e8b5,#665528);transform:rotate(1deg)}.sb-think[aria-pressed=true]{color:#fffdf7;background:light-dark(#8780bf,#968fd2)}.sb-next{padding:0 0 0 12px;border:0;color:light-dark(#5c5792,#d8d1ff);background:transparent}.sb-post{display:block;margin:42px auto 0;min-height:48px;padding:0 18px;border:0;border-radius:49% 51% 48% 52%;color:#fffdf7;background:light-dark(#7e75b5,#968ed0);font-size:18px;box-shadow:2px 3px 0 light-dark(#5b5485,#5d567f);transform:rotate(.7deg);cursor:pointer}.sb-nav{display:flex;justify-content:center;gap:18px;padding:13px 18px 19px}.sb-nav button{min-height:42px;padding:0 3px;border:0;color:light-dark(#8c857b,#bbb2a4);background:transparent;font-size:16px;cursor:pointer}.sb-nav button[aria-current=page]{color:light-dark(#514c82,#d8d1ff);text-decoration:underline wavy light-dark(#9891cf,#b5ace6) 1.5px;text-underline-offset:5px}@media(max-width:360px){.sb-phone{border-radius:14px 18px 16px 20px}main{padding-inline:17px}.sb-head{padding-inline:18px}}
  </style>
  <style>
    #storybook-feed{color:light-dark(#292722,#fffaf1)}
    #storybook-feed .sb-phone{background-image:none}
    #storybook-feed .sb-card{border-width:1px;box-shadow:2px 2px 0 light-dark(#f1dfac,#5a4b28)}
    #storybook-feed .sb-meta{color:light-dark(#5c574f,#e0d7cb);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-size:14px;font-weight:500}
    #storybook-feed .sb-body{color:light-dark(#292722,#fffaf1);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-size:19px;line-height:1.9}
  </style>
  <section class="sb-phone" aria-label="目安箱 フィード"><span class="sb-sun" aria-hidden="true"></span><header class="sb-head"><p class="sb-title">目安箱</p></header><main><h1 class="sb-hello">きょうは、<br>どんな声に会えるかな。</h1><article class="sb-card" aria-label="ひとつの悩み"><p class="sb-meta">10代　・　関西</p><p class="sb-body">周りは進む道を決めているように見えて、少し焦ります。</p><div class="sb-actions"><button class="sb-think" type="button" aria-pressed="false">うんうん　18</button><button class="sb-next" type="button">つぎへ　→</button></div></article><button class="sb-post" type="button">悩みを置く</button></main><nav class="sb-nav" aria-label="画面移動"><button type="button" aria-current="page">読む</button><button type="button">クイズ</button><button type="button">投稿</button><button type="button">履歴</button></nav></section>
  <script>(()=>{const root=document.getElementById('storybook-feed'),button=root.querySelector('.sb-think');button.addEventListener('click',()=>{const active=button.getAttribute('aria-pressed')==='true';button.setAttribute('aria-pressed',String(!active));button.textContent=active?'うんうん　18':'うんうん　19'})})()</script>
</div>
<style>#storybook-feed .sb-card:before{width:62px;height:16px;top:-8px;left:21px;border-radius:1px;background:light-dark(#b9ded2cc,#527f71cc);clip-path:polygon(0 7%,100% 0,97% 94%,4% 100%);transform:rotate(-5deg)}</style>
<style>#storybook-feed .sb-sun{display:none}</style>
