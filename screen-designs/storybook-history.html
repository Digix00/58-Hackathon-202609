<div id="storybook-history" aria-label="目安箱の絵本とクレヨンを思わせる履歴画面デザイン案">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yomogi&display=swap');
    #storybook-history{color:light-dark(#4b4944,#f5f0e9);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif}#storybook-history *{box-sizing:border-box}.sh-phone{position:relative;max-width:390px;margin:auto;overflow:hidden;border:2px solid light-dark(#49463f,#e2d9ca);border-radius:22px 27px 24px 29px;background-color:light-dark(#fffdf7,#292723);background-image:repeating-linear-gradient(7deg,transparent 0 8px,light-dark(#ede7dd55,#ffffff08) 9px 10px)}.sh-moon{position:absolute;top:26px;right:26px;width:37px;height:37px;border:3px solid light-dark(#aea3dc,#a99bd8);border-radius:50%;opacity:.8}.sh-moon:after{content:"";position:absolute;top:-6px;left:9px;width:31px;height:31px;border-radius:50%;background:light-dark(#fffdf7,#292723)}.sh-head{position:relative;padding:26px 25px 0}.sh-title{margin:0;font:400 27px "Yomogi","Hiragino Maru Gothic ProN",cursive;letter-spacing:.07em;transform:rotate(-1.5deg)}.sh-main{position:relative;padding:44px 23px 27px}.sh-main h1{margin:0;font:400 25px/1.5 "Yomogi","Hiragino Maru Gothic ProN",cursive}.sh-subtitle{margin:4px 0 25px;color:light-dark(#7d766c,#bbb2a4);font-size:13px}.sh-shelf{position:relative;display:flex;align-items:flex-end;gap:7px;min-height:112px;padding:10px 12px 0;border-bottom:3px solid light-dark(#726a5d,#c8beae)}.sh-shelf:after{content:"";position:absolute;bottom:-8px;left:23px;width:73px;height:6px;border-radius:50%;background:light-dark(#e7ad4f,#d4a051);transform:rotate(-1deg)}.sh-bookmark{position:relative;flex:1;min-width:0;height:81px;padding:10px 3px 7px;border:2px solid light-dark(#6d695f,#d6cec1);border-bottom:0;border-radius:12px 13px 0 0;color:inherit;background:light-dark(#f5dca3,#675629);font:13px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer;transform:rotate(-2deg)}.sh-bookmark:nth-child(2){height:96px;background:light-dark(#c8e3da,#3c6057);transform:rotate(1.5deg)}.sh-bookmark:nth-child(3){height:70px;background:light-dark(#ddd4f5,#554a78);transform:rotate(-.7deg)}.sh-bookmark:nth-child(4){height:89px;background:light-dark(#f3c9b8,#754f45);transform:rotate(1deg)}.sh-bookmark[aria-pressed=true]{margin-bottom:8px;box-shadow:2px 3px 0 light-dark(#645e55,#bdb4a6)}.sh-bookmark b{display:block;font:400 16px "Yomogi","Hiragino Maru Gothic ProN",cursive}.sh-bookmark span{display:block;margin-top:4px;font:10px/1.25 "Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif}.sh-selected{min-height:39px;margin:17px 2px 28px;color:light-dark(#625d87,#d9d2ff);font:17px/1.55 "Yomogi","Hiragino Maru Gothic ProN",cursive}.sh-next{position:relative;padding:21px 19px 18px;border:2px solid light-dark(#6d695f,#d6cec1);border-radius:23px 18px 25px 16px;background:light-dark(#fffefb,#312e29);box-shadow:3px 4px 0 light-dark(#b7ded1,#496d63);transform:rotate(.45deg)}.sh-next:before{content:"";position:absolute;width:36px;height:9px;top:-7px;right:28px;border-radius:50%;background:light-dark(#f1c4a8,#7f594c);transform:rotate(7deg)}.sh-next p{margin:0}.sh-next-label{color:light-dark(#817a70,#bcb2a5);font:15px "Yomogi","Hiragino Maru Gothic ProN",cursive}.sh-next-title{margin-top:7px!important;font:20px "Yomogi","Hiragino Maru Gothic ProN",cursive}.sh-next button,.sh-quiz{min-height:40px;padding:0;border:0;color:light-dark(#5d5792,#d8d1ff);background:transparent;font:17px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer}.sh-next button{margin-top:10px}.sh-quiz{display:block;width:max-content;margin:25px auto 0;text-decoration:underline wavy light-dark(#aaa2dc,#b5ace6) 1px;text-underline-offset:6px}.sh-nav{display:flex;justify-content:center;gap:18px;padding:13px 18px 19px}.sh-nav button{min-height:42px;padding:0 3px;border:0;color:light-dark(#8c857b,#bbb2a4);background:transparent;font:16px "Yomogi","Hiragino Maru Gothic ProN",cursive;cursor:pointer}.sh-nav button[aria-current=page]{color:light-dark(#514c82,#d8d1ff);text-decoration:underline wavy light-dark(#9891cf,#b5ace6) 1.5px;text-underline-offset:5px}
  </style>
  <style>
    #storybook-history{color:light-dark(#292722,#fffaf1)}
    #storybook-history .sh-phone{background-image:none}
    #storybook-history .sh-subtitle{color:light-dark(#5c574f,#e0d7cb);font-size:14px}
    #storybook-history .sh-bookmark{border-width:1px;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-size:14px;font-weight:500}
    #storybook-history .sh-bookmark b{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-size:15px;font-weight:700}
    #storybook-history .sh-bookmark span{font-size:12px;font-weight:500}
    #storybook-history .sh-selected{color:light-dark(#3f396c,#e3dcff);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-size:16px;font-weight:500}
    #storybook-history .sh-next{border-width:1px;box-shadow:5px 6px 0 light-dark(#b7ded1,#496d63)}
  </style>
  <section class="sh-phone" aria-label="目安箱 履歴"><span class="sh-moon" aria-hidden="true"></span><header class="sh-head"><p class="sh-title">目安箱</p></header><main class="sh-main"><h1>これまでに会った声。</h1><p class="sh-subtitle">この端末で、5つの声を読みました。</p><div class="sh-shelf" role="group" aria-label="出会ったテーマ"><button class="sh-bookmark" type="button" aria-pressed="false"><b>進路</b><span>関西</span></button><button class="sh-bookmark" type="button" aria-pressed="true"><b>仕事</b><span>関東</span></button><button class="sh-bookmark" type="button" aria-pressed="false"><b>家族</b><span>中部</span></button><button class="sh-bookmark" type="button" aria-pressed="false"><b>友だち</b><span>九州</span></button></div><p class="sh-selected" id="sh-selected" aria-live="polite">「仕事」の声に、いちばん多く出会いました。</p><section class="sh-next" aria-label="次に読むおすすめ"><p class="sh-next-label">つぎに、ひらくなら</p><p class="sh-next-title">まだ会っていない地域の声</p><button type="button">読んでみる　→</button></section><button class="sh-quiz" type="button">きょうの手紙をひらく</button></main><nav class="sh-nav" aria-label="画面移動"><button type="button">読む</button><button type="button">クイズ</button><button type="button">投稿</button><button type="button" aria-current="page">履歴</button></nav></section>
  <script>(()=>{const root=document.getElementById('storybook-history'),marks=[...root.querySelectorAll('.sh-bookmark')],selected=root.querySelector('#sh-selected');marks.forEach(mark=>mark.addEventListener('click',()=>{marks.forEach(item=>item.setAttribute('aria-pressed',String(item===mark)));selected.textContent=`「${mark.querySelector('b').textContent}」の声に、出会いました。`}))})()</script>
</div>
<style>#storybook-history .sh-next:before{width:62px;height:16px;top:-8px;right:21px;border-radius:1px;background:light-dark(#f1c4a8cc,#7f594ccc);clip-path:polygon(3% 3%,100% 8%,96% 100%,0 92%);transform:rotate(5deg)}</style>
<style>#storybook-history .sh-shelf:after{display:none}</style>
<style>#storybook-history .sh-moon{display:none}</style>
