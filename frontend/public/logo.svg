<!--
  Qiite の題字（外部向けの一枚）。

  画面の中で使うものは frontend/src/shared/components/QiiteLogo.tsx が持つ。
  こちらは OGP・資料・README など、React の外へ渡すための同じ絵で、
  字の形も色もあちらから写してある。片方を直したらもう片方も直す。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 18 276 106" width="276" height="106" role="img" aria-label="Qiite">
